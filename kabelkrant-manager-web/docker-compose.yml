services:
  kabelkrant-manager:
    build: .
    ports:
      - "80:80"
    volumes:
      # Persist settings and play history
      - ./data:/app/data
      # Mount video files (read-write for uploads)
      - ./videos:/videos
    environment:
      - OBS_WEBSOCKET_URL=ws://host.docker.internal:4455
      - OBS_WEBSOCKET_PASSWORD=rtvserver
      - VIDEO_BASE_PATH=/videos
      - DATA_PATH=/app/data
      - PORT=80
    extra_hosts:
      # For accessing OBS on the host machine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
